[project]
name = "my-last-ai-girlfriends"
version = "0.2.0"
description = "MY LAST AI GIRLFRIENDS local-first personal companion"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lakshman Ghosh" }]
dependencies = []

[project.scripts]
my-last-ai-girlfriends = "my_last_ai_girlfriends.main:main"

[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
default-groups = []
